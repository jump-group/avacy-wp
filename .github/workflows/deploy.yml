name: Deploy to WordPress.org SVN

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  deploy:
    name: Deploy Plugin to WordPress.org SVN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Deploying version: ${VERSION}"

      - name: Checkout SVN trunk
        run: |
          svn checkout \
            https://plugins.svn.wordpress.org/avacy/trunk \
            /tmp/svn-trunk \
            --non-interactive

      - name: Clear SVN trunk (preserve .svn metadata)
        run: |
          cd /tmp/svn-trunk
          find . -maxdepth 1 -not -name '.svn' -not -name '.' -exec rm -rf {} +

      - name: Copy plugin distribution files to SVN trunk
        run: |
          # Only copy files needed for the plugin runtime.
          # Dev tooling (.wp-env.json, blueprints/, tests/, scripts/,
          # playwright.config.ts, DEVELOPMENT.md, node_modules/, etc.)
          # is excluded — those live in the repo but not on WP.org.

          cp avacy.php        /tmp/svn-trunk/
          cp readme.md        /tmp/svn-trunk/
          cp changelog.md     /tmp/svn-trunk/
          cp composer.json    /tmp/svn-trunk/
          cp composer.lock    /tmp/svn-trunk/
          cp package.json     /tmp/svn-trunk/
          cp rector.php       /tmp/svn-trunk/

          cp -r src/           /tmp/svn-trunk/src/
          cp -r vendor/        /tmp/svn-trunk/vendor/
          cp -r assets/        /tmp/svn-trunk/assets/
          cp -r styles/        /tmp/svn-trunk/styles/
          cp -r languages/     /tmp/svn-trunk/languages/

      - name: Verify root structure (avacy.php must be at SVN root)
        run: |
          if [ ! -f /tmp/svn-trunk/avacy.php ]; then
            echo "::error::avacy.php not found at SVN trunk root — plugin won't load!"
            exit 1
          fi
          echo "Root structure OK:"
          ls -la /tmp/svn-trunk/

      - name: Stage SVN changes (add new, remove deleted)
        run: |
          cd /tmp/svn-trunk
          # Add unversioned files
          svn add --force --parents . --depth infinity -q 2>/dev/null || true
          # Remove files that were deleted from the repo
          svn status | grep '^\!' | awk '{print $2}' | xargs -r svn delete -q
          echo "SVN status:"
          svn status | head -80

      - name: Commit to SVN trunk
        run: |
          cd /tmp/svn-trunk
          # If there are no changes, skip the commit
          if svn status | grep -qE '^[AMDRC]'; then
            svn commit \
              -m "Deploy version ${{ steps.version.outputs.version }}" \
              --username "${{ secrets.SVN_USERNAME }}" \
              --password "${{ secrets.SVN_PASSWORD }}" \
              --non-interactive --no-auth-cache
          else
            echo "No changes to commit to SVN trunk."
          fi

      - name: Create SVN tag from trunk
        run: |
          svn cp \
            https://plugins.svn.wordpress.org/avacy/trunk \
            https://plugins.svn.wordpress.org/avacy/tags/${{ steps.version.outputs.version }} \
            -m "Tag version ${{ steps.version.outputs.version }}" \
            --username "${{ secrets.SVN_USERNAME }}" \
            --password "${{ secrets.SVN_PASSWORD }}" \
            --non-interactive --no-auth-cache
